  <path d="M152 50H166C172.627 50 178 55.3726 178 62V66C178 76.4934 169.493 85 159 85H152" stroke="#EAB308" stroke-width="6" stroke-linecap="round" fill="none"/>
  
  <!-- Stem & Base -->
  <path d="M112 108H128V126H112V108Z" fill="#CA8A04" />
  <rect x="94" y="126" width="52" height="16" rx="4" fill="#854D0E" />
  <rect x="86" y="142" width="68" height="10" rx="3" fill="#713F12" />
  
