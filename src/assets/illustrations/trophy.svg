<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" fill="none">
  <defs>
    <linearGradient id="trophyGold" x1="80" y1="30" x2="160" y2="130" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <linearGradient id="trophyGlow" x1="120" y1="20" x2="120" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EAB308" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#EAB308" stop-opacity="0" />
    </linearGradient>
    <filter id="trophyFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Glow backdrop -->
  <circle cx="120" cy="85" r="65" fill="url(#trophyGlow)" filter="url(#trophyFilter)" />
  
